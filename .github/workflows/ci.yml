name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test
        env:
          RAZORPAY_KEY_ID: rzp_test_ci
          RAZORPAY_KEY_SECRET: test_secret_ci_only
          RAZORPAY_WEBHOOK_SECRET: test_webhook_secret_ci

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://sri-srinivasa-hospital.vercel.app
          NEXT_PUBLIC_USE_SUPABASE: "false"

  # Optional: run Playwright only when secrets or browser cache available
